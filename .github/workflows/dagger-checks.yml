name: Dagger Checks (Phase 1 pilot)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: k8s-runner-civicnet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs against the always-on shared Dagger engine; the runner image has
      # the dagger CLI baked in and _EXPERIMENTAL_DAGGER_RUNNER_HOST points at
      # the node-local engine (see arc runner HelmRelease). Cache is persistent.
      - name: Lint (dagger)
        run: dagger call --mod github.com/snoby/dagger-checks lint --source=.

      - name: PII scan (dagger)
        run: dagger call --mod github.com/snoby/dagger-checks pii-scan --source=.
