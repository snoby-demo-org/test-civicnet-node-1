name: Build CivicNet Node Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build (e.g. v3.0.8). Leave empty for current vendored source.'
        required: false
        default: ''

jobs:
  build:
    runs-on: k8s-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vendor upstream + apply patches (if tag requested)
        if: inputs.tag != ''
        run: |
          ./patch.sh                        # clone upstream source + apply patches/
          git -C civicnet checkout "$INPUT_TAG"
        env:
          INPUT_TAG: 

      - name: Build image
        run: |
          TAG="${INPUT_TAG:-$(git -C civicnet rev-parse --short HEAD 2>/dev/null || echo local)}"
          TAG="$TAG" ./build.sh

      - name: Push image
        run: |
          TAG="${INPUT_TAG:-$(git -C civicnet rev-parse --short HEAD 2>/dev/null || echo local)}"
          docker push "iotapi322/civicnet:$TAG"
